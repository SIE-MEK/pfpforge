<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signing you in — PFPFORGE</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800;900&family=Sora:wght@300;400&display=swap" rel="stylesheet">
<style>
  body{font-family:'Sora',sans-serif;background:#0a0612;color:#f4eefb;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background-image:radial-gradient(60vw 60vw at 20% 10%,rgba(255,61,154,.22),transparent 60%),radial-gradient(60vw 60vw at 80% 90%,rgba(51,230,255,.18),transparent 60%)}
  h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:1.6rem;margin-bottom:12px}
  p{color:#a99bc4;font-weight:300}
  a{color:#33e6ff}
</style>
</head>
<body>
  <div>
    <h1 id="h">Signing you in…</h1>
    <p id="msg">One moment.</p>
  </div>
<script>
(async function(){
  const h=document.getElementById('h'), msg=document.getElementById('msg');
  const m=location.hash.match(/token=([^&]+)/);
  if(!m){ h.textContent='Link not valid'; msg.textContent='Please request a new login link.'; return; }
  try{
    const r=await fetch('/.netlify/functions/auth-verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:decodeURIComponent(m[1])})});
    const d=await r.json();
    if(d.token){
      try{ localStorage.setItem('pfp_token',d.token); localStorage.setItem('pfp_pro','1'); }catch(e){}
      h.textContent='You\'re in ✦'; msg.innerHTML='Pro unlocked. <a href="index.html#forge">Start forging →</a>';
      setTimeout(()=>location.href='index.html#forge',1200);
    }else{
      h.textContent='Couldn\'t sign you in'; msg.textContent=d.error||'The link may have expired — request a new one.';
    }
  }catch(e){ h.textContent='Something went wrong'; msg.textContent='Please try the link again.'; }
})();
</script>
</body>
</html>
