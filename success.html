<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Pro — PFPFORGE</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;800;900&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0612;--ink:#f4eefb;--muted:#a99bc4;--magenta:#ff3d9a;--violet:#9b5cff;--cyan:#33e6ff;--line:rgba(255,255,255,.09)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;
    background-image:radial-gradient(60vw 60vw at 20% 10%,rgba(255,61,154,.25),transparent 60%),radial-gradient(60vw 60vw at 80% 90%,rgba(51,230,255,.2),transparent 60%)}
  .box{max-width:460px}
  .badge{width:74px;height:74px;border-radius:50%;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:linear-gradient(135deg,var(--magenta),var(--cyan));box-shadow:0 0 50px rgba(155,92,255,.5)}
  h1{font-family:'Unbounded',sans-serif;font-weight:900;font-size:2rem;letter-spacing:-.02em;margin-bottom:14px}
  p{color:var(--muted);font-weight:300;line-height:1.6;margin-bottom:26px}
  a.btn{display:inline-block;font-family:'Unbounded',sans-serif;font-weight:800;font-size:1rem;padding:15px 30px;border-radius:14px;color:#fff;text-decoration:none;background:linear-gradient(110deg,var(--magenta),var(--violet) 50%,var(--cyan));background-size:200% 100%;box-shadow:0 0 40px rgba(155,92,255,.45);transition:.4s}
  a.btn:hover{background-position:100% 0;transform:translateY(-2px)}
  .small{font-size:.8rem;opacity:.7;margin-top:22px}
</style>
</head>
<body>
  <div class="box">
    <div class="badge">✦</div>
    <h1 id="h">Finishing up…</h1>
    <p id="msg">Confirming your payment with Stripe. One moment.</p>
    <a class="btn" id="btn" href="index.html#forge" style="display:none">Start forging →</a>
    <p class="small" id="small" style="display:none">A receipt is on its way to your email from Stripe.</p>
  </div>
<script>
  // Verify the checkout server-side and store the signed session token that
  // unlocks Pro. The session_id is removed from the address bar right away so
  // it doesn't linger in history or get shared; it's kept in this tab's
  // sessionStorage until we have a token, so Retry and reload still work.
  (async function(){
    const h=document.getElementById('h'), msg=document.getElementById('msg'), btn=document.getElementById('btn');
    let sid=new URLSearchParams(location.search).get('session_id');
    try{
      if(sid) sessionStorage.setItem('pfp_sid',sid); else sid=sessionStorage.getItem('pfp_sid');
      history.replaceState(null,'',location.pathname);
    }catch(e){}
    function fail(text,canRetry){
      h.textContent='Almost there';
      msg.textContent=text+' If you were charged and this keeps failing, use “Email me a login link” on the site with the email you paid with, or reply to your Stripe receipt.';
      btn.textContent=canRetry?'Try again':'Back to PFPFORGE →';
      btn.style.display='inline-block';
      if(canRetry){ btn.onclick=e=>{ e.preventDefault(); btn.style.display='none'; h.textContent='Finishing up…'; msg.textContent='Confirming your payment with Stripe. One moment.'; run(); }; }
      else btn.onclick=null;
    }
    async function run(){
      if(!sid) return fail('We couldn’t find your checkout details.',false);
      try{
        const r=await fetch('/.netlify/functions/auth-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid})});
        const d=await r.json();
        if(!d.token) return fail(d.error||'We couldn’t confirm your payment yet.', r.status!==410 && r.status!==400);
        try{ localStorage.setItem('pfp_token',d.token); localStorage.removeItem('pfp_pro'); sessionStorage.removeItem('pfp_sid'); }catch(e){}
        h.textContent='You\'re Pro now';
        msg.textContent='Payment complete — real AI photo morphing is unlocked and ads are off. Head back and forge something.';
        btn.textContent='Start forging →'; btn.onclick=null; btn.style.display='inline-block';
        document.getElementById('small').style.display='block';
      }catch(e){ fail('Something went wrong confirming your payment.',true); }
    }
    run();
  })();
</script>
</body>
</html>
