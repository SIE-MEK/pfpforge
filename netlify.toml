# PFPFORGE — Netlify configuration
# Static site published from the repo root, plus the serverless functions.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The repo root is the publish folder, so keep docs, config and server source
# from being downloadable on the live site. (Functions still deploy normally.)
[[redirects]]
  from = "/SETUP.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/CHECKLIST.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/TESTS.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/DOMAIN.md"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/GO-LIVE.md.docx"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Login and payment-return pages handle tokens: never cache them.
[[headers]]
  for = "/auth.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/success.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
